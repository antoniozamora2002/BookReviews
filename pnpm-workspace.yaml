# Ajustes de pnpm (desde pnpm 10 ya no se leen desde el campo "pnpm" de package.json)

# Fuerza js-yaml >=4 en todo el arbol (parche de seguridad, ver commit 57bb1d0)
overrides:
  js-yaml: ^4.1.1

# pnpm bloquea los lifecycle scripts por defecto; estos si pueden ejecutarlos
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  bcrypt: true
