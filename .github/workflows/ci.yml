name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Los tests de src/ son unitarios y mockean los repositorios, pero los
    # e2e de test/ arrancan AppModule contra una BD real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Debe ir ANTES de setup-node para que cache:'pnpm' encuentre el binario.
      # Sin 'version': toma la del campo "packageManager" de package.json
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Coincide con tu Dockerfile
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --check / sin --fix: estos comandos REPORTAN, no arreglan. Con
      # --write y --fix el step siempre salia con codigo 0 y no verificaba nada
      - name: Verificar formato
        run: pnpm run format:check

      - name: Verificar Lint
        run: pnpm run lint:check

      - name: Ejecutar Tests Unitarios
        run: pnpm run test

      # DB_PORT_TEST: el service container expone 5432; en local es 5434
      - name: Ejecutar Tests E2E
        run: pnpm run test:e2e
        env:
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432

      - name: Verificar Build de Producción (NestJS)
        run: pnpm run build

      - name: Verificar Build de Docker
        # Esto asegura que tu Dockerfile es válido antes de mezclar código
        run: docker build . --file Dockerfile
