name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Sin servicio de Postgres: los tests de src/ son unitarios y mockean
    # los repositorios, nadie abre una conexion. Si algun dia se añaden los
    # e2e de test/ al pipeline habra que volver a levantarlo.

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Debe ir ANTES de setup-node para que cache:'pnpm' encuentre el binario.
      # Sin 'version': toma la del campo "packageManager" de package.json
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Coincide con tu Dockerfile
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --check / sin --fix: estos comandos REPORTAN, no arreglan. Con
      # --write y --fix el step siempre salia con codigo 0 y no verificaba nada
      - name: Verificar formato
        run: pnpm run format:check

      - name: Verificar Lint
        run: pnpm run lint:check

      - name: Ejecutar Tests Unitarios
        run: pnpm run test

      - name: Verificar Build de Producción (NestJS)
        run: pnpm run build

      - name: Verificar Build de Docker
        # Esto asegura que tu Dockerfile es válido antes de mezclar código
        run: docker build . --file Dockerfile
